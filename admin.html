<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#071b18"><title>إدارة المكتبة | الشيخ محمود فتحي</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet"><style>
:root{--bg:#071b18;--panel:#0d2924;--gold:#d8bb7e;--text:#f5f0e6;--muted:#a6b7ad;--line:#ffffff19}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 78% 0,#154538 0,transparent 38%),var(--bg);color:var(--text);font-family:Cairo,sans-serif}a{color:var(--gold);text-decoration:none}.wrap{max-width:900px;margin:35px auto;padding:20px}.head,.panel{border:1px solid var(--line);background:#0b241fdd;border-radius:18px;padding:22px;margin-bottom:18px}.head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.muted{color:var(--muted);font-size:13px;line-height:1.9}.form{display:grid;gap:12px}.form label{display:grid;gap:6px;font-size:12px;color:#d0dbd3}.form input,.form select,.form textarea{width:100%;background:#0a241f;border:1px solid var(--line);border-radius:10px;padding:12px;color:var(--text);font:inherit;font-size:13px}.btn{display:inline-flex;align-items:center;justify-content:center;padding:11px 16px;border:1px solid var(--line);border-radius:10px;background:#ffffff06;color:var(--text);font:inherit;font-size:13px;cursor:pointer}.primary{background:linear-gradient(135deg,#e6d09c,#b8995a);color:#14231c;border:0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.msg{font-size:12px;line-height:1.8;color:#ead5a7;overflow-wrap:anywhere}.admin-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px;border:1px solid var(--line);border-radius:10px;margin-top:8px;font-size:12px}.danger{color:#f0a29a;border:0;background:transparent;cursor:pointer;font:inherit}@media(max-width:650px){.grid{grid-template-columns:1fr}.wrap{padding:12px;margin:12px auto}.head,.panel{padding:16px}}
</style></head><body><main class="wrap">
<header class="head"><div><div style="color:var(--gold);font-size:12px">لوحة إدارة مستقلة</div><h1 style="font-size:23px;margin:5px 0">إدارة مكتبة الشيخ محمود فتحي</h1><div class="muted">صفحة منفصلة عن واجهة الزوار.</div></div><a href="./">← العودة للموقع</a></header>
<section class="panel" id="authPanel"><h2>تسجيل دخول الإدارة</h2><p class="muted">استخدم حساب الإدارة المعتمد فقط.</p><form class="form" id="loginForm"><label>البريد الإلكتروني<input id="email" type="email" autocomplete="username" required></label><label>كلمة المرور<input id="password" type="password" autocomplete="current-password" required></label><button class="btn primary" type="submit">تسجيل الدخول</button><p class="msg" id="authMsg" role="status"></p></form><button class="btn" id="recoverBtn" type="button">إرسال رابط إعادة تعيين كلمة المرور</button></section>
<section id="dashboard" hidden><div class="panel"><div class="head" style="padding:0;border:0;background:none"><h2>إدارة المحتوى</h2><button class="btn" id="logout">تسجيل الخروج</button></div><p class="muted" id="who"></p><form class="form" id="addForm"><label>عنوان المحتوى<input id="itemTitle" maxlength="120" required></label><label>رابط المنشور أو الوسائط<input id="itemUrl" type="url" required placeholder="https://t.me/... أو https://youtu.be/..."></label><label>نوع المحتوى<select id="itemType"><option value="telegram">منشور تليجرام</option><option value="youtube">يوتيوب</option><option value="audio">ملف صوتي مباشر</option><option value="video">فيديو مباشر</option></select></label><label>وصف مختصر<textarea id="itemDesc" rows="2" maxlength="300"></textarea></label><button class="btn primary">إضافة للمكتبة</button><p class="msg" id="addMsg"></p></form></div>
<div class="panel"><h2>هوية الموقع</h2><form class="form" id="settingsForm"><label>اسم الموقع<input id="setName" required maxlength="80"></label><label>الوصف تحت الاسم<input id="setSubtitle" required maxlength="100"></label><label>العنوان الرئيسي<input id="setHero" required maxlength="160"></label><label>وصف الصفحة الرئيسية<textarea id="setDescription" required maxlength="400"></textarea></label><label>رابط قناة تليجرام<input id="setTelegram" type="url" required></label><label>رابط الشعار (صورة عامة)<input id="setLogo" type="url"></label><div class="grid"><label>لون التمييز<input id="setGold" type="color"></label><label>لون الخلفية<input id="setBg" type="color"></label></div><button class="btn primary">حفظ إعدادات الموقع</button><p class="msg" id="settingsMsg"></p></form></div>
<div class="panel"><h2>المحتوى المنشور</h2><div id="itemsList" class="muted">جارٍ التحميل…</div></div></section>
</main><script type="module" src="./admin.js"></script></body></html>
